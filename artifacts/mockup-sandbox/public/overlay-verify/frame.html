<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMEX Overlay Frame</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
}
body { display: flex; align-items: flex-end; justify-content: flex-start; padding: 20px; }

/* ---- REAL OVERLAY CSS ---- */
/**
 * SEMEX Overlay V2 Styles
 * States: Pill (Minimized), Full (Maximized), Dock (Edge)
 * Features: Position Switch, Mobile Responsive
 */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* =========================================
   CONTAINER
   ========================================= */
#semex-overlay {
    position: fixed;
    z-index: 999999;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: white;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
}

#semex-overlay * {
    box-sizing: border-box;
}

/* Position Classes */
#semex-overlay.pos-bl {
    bottom: 20px;
    left: 20px;
}

#semex-overlay.pos-br {
    bottom: 20px;
    right: 20px;
}

#semex-overlay.pos-tl {
    top: 20px;
    left: 20px;
}

#semex-overlay.pos-tr {
    top: 20px;
    right: 20px;
}

/* =========================================
   STATE: PILL (Minimized)
   ========================================= */
#semex-overlay.state-pill .overlay-full {
    display: none;
}

#semex-overlay.state-pill .overlay-dock {
    display: none;
}

#semex-overlay.state-pill .overlay-pill {
    display: flex;
}

.overlay-pill {
    display: none;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 40px;
    padding: 6px 14px 6px 6px;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    cursor: pointer;
    pointer-events: auto;
    animation: semex-slideIn 0.4s ease;
}

.pill-logo {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
    display: flex;
    align-items: center;
    justify-content: center;
}

.pill-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Logo Letter Fallback (CSP-safe) */
.logo-letter {
    font-weight: 800;
    font-size: 12px;
    color: white;
    display: flex;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
}

.full-brand-logo .logo-letter {
    font-size: 10px;
}

.pill-status {
    display: flex;
    align-items: center;
    gap: 6px;
}

.pill-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    animation: semex-pulse 1.5s infinite;
    flex-shrink: 0;
}

.pill-dot.charged {
    background: #10b981;
}

.pill-dot.live {
    background: #fbbf24;
}

.pill-dot.dead {
    background: #ef4444;
    animation: none;
}

.pill-dot.processing {
    background: #3b82f6;
}

.pill-text {
    font-size: 12px;
    font-weight: 600;
    color: white;
    max-width: 120px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.pill-btns {
    display: flex;
    gap: 4px;
}

.pill-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    color: white;
}

.pill-btn:hover {
    transform: scale(1.1);
}

.pill-btn.play {
    background: #10b981;
}

.pill-btn.pause {
    background: #f59e0b;
    display: none;
}

.pill-btn.stop {
    background: #ef4444;
}

.pill-btn.expand {
    background: rgba(255, 255, 255, 0.15);
}

/* =========================================
   STATE: FULL (Maximized)
   ========================================= */
#semex-overlay.state-full .overlay-pill {
    display: none;
}

#semex-overlay.state-full .overlay-dock {
    display: none;
}

#semex-overlay.state-full .overlay-full {
    display: block;
}

.overlay-full {
    display: none;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    width: 300px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    pointer-events: auto;
    animation: semex-slideIn 0.4s ease;
}

/* Mobile Responsive */
@media (max-width: 480px) {
    .overlay-full {
        width: calc(100vw - 40px);
        max-width: 340px;
    }

    .full-stats {
        flex-wrap: wrap;
        gap: 6px;
    }

    .stat-item {
        flex: 1 1 40%;
    }

    .stat-div {
        display: none;
    }
}

.full-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.full-brand {
    display: flex;
    align-items: center;
    gap: 8px;
}

.full-brand-logo {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    overflow: hidden;
    background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
    display: flex;
    align-items: center;
    justify-content: center;
}

.full-brand-logo img {
    width: 100%;
    height: 100%;
}

.full-brand-text {
    display: flex;
    align-items: baseline;
    gap: 4px;
}

.full-brand-name {
    font-weight: 800;
    font-size: 14px;
    background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.full-brand-tag {
    font-size: 9px;
    color: #64748b;
    text-transform: uppercase;
}

.header-btns {
    display: flex;
    gap: 4px;
}

.header-btn {
    background: transparent;
    border: none;
    color: #64748b;
    font-size: 10px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.2s;
}

.header-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: white;
}

.full-body {
    padding: 9px;
}

/* Status Indicator */
.full-status {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.25);
    padding: 6px 8px;
    border-radius: 7px;
    margin-bottom: 7px;
}

.full-status-icon {
    font-size: 16px;
}

.full-status-text {
    font-weight: 600;
    font-size: 13px;
    flex: 1;
}

/* Stats Dashboard */
.full-stats {
    display: flex;
    justify-content: space-between;
    background: rgba(30, 41, 59, 0.5);
    border-radius: 7px;
    padding: 6px 8px;
    margin-bottom: 7px;
    position: relative;
}

.stats-toggle {
    position: absolute;
    top: 4px;
    right: 4px;
    background: transparent;
    border: none;
    color: #64748b;
    font-size: 10px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 3px;
}

.stats-toggle:hover {
    color: white;
}

.stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex: 1;
}

.stat-label {
    font-size: 9px;
    color: #64748b;
    text-transform: uppercase;
}

.stat-value {
    font-size: 14px;
    font-weight: 700;
}

.stat-value.charged {
    color: #10b981;
}

.stat-value.live {
    color: #fbbf24;
}

.stat-value.dead {
    color: #ef4444;
}

.stat-div {
    width: 1px;
    background: rgba(255, 255, 255, 0.08);
}

/* Details */
.full-details {
    background: rgba(0, 0, 0, 0.2);
    padding: 7px 8px;
    border-radius: 6px;
    font-size: 10px;
    color: #94a3b8;
    margin-bottom: 7px;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 2px;
    line-height: 1.35;
}

.detail-row:last-child {
    margin-bottom: 0;
}

.detail-val {
    color: #e2e8f0;
    font-family: 'Courier New', monospace;
    font-size: 11px;
}

/* Controls */
.full-controls {
    display: flex;
    gap: 6px;
}

.ctrl-btn {
    padding: 8px 6px;
    border: none;
    border-radius: 7px;
    font-weight: 600;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color: white;
    transition: all 0.15s;
}

.ctrl-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
}

.ctrl-btn:active {
    transform: translateY(0);
}

.ctrl-btn.start {
    flex: 1;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}

.ctrl-btn.pause {
    flex: 1;
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    display: none;
}

.ctrl-btn.stop {
    width: 40px;
    background: #ef4444;
}

.ctrl-btn.blur {
    width: 40px;
    background: #334155;
}

/* Blur Mode */
.overlay-full.blur-active .detail-val {
    filter: blur(4px);
}

/* =========================================
   STATE: DOCK (Edge Strip)
   ========================================= */
#semex-overlay.state-dock .overlay-pill {
    display: none;
}

#semex-overlay.state-dock .overlay-full {
    display: none;
}

#semex-overlay.state-dock .overlay-dock {
    display: flex;
}

.overlay-dock {
    display: none;
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-right: none;
    border-radius: 10px 0 0 10px;
    padding: 12px 8px;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: -4px 0 16px rgba(0, 0, 0, 0.3);
    pointer-events: auto;
    animation: semex-slideInRight 0.3s ease;
}

.dock-logo {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
    display: flex;
    align-items: center;
    justify-content: center;
}

.dock-logo img {
    width: 100%;
    height: 100%;
}

.dock-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    animation: semex-pulse 1.5s infinite;
}

.dock-text {
    writing-mode: vertical-rl;
    font-size: 10px;
    font-weight: 600;
    color: #64748b;
}

/* =========================================
   ANIMATIONS
   ========================================= */
@keyframes semex-slideIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes semex-slideInRight {
    from {
        opacity: 0;
        transform: translateX(20px) translateY(-50%);
    }

    to {
        opacity: 1;
        transform: translateX(0) translateY(-50%);
    }
}

@keyframes semex-pulse {
    0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
    }

    70% {
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
    }

    100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
    }
}

/* Hidden State */
.overlay-hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(20px) scale(0.9);
}
/* ============================================================
   SEMEX overlay redesign — premium dark glass theme (override).
   Appended last so it wins. Scoped to #semex-overlay.
   ============================================================ */
#semex-overlay {
    --sx-bg: #0b0b0f;
    --sx-surface: #16161c;
    --sx-line: #26262e;
    --sx-txt: #f5f5f7;
    --sx-mut: #9a9aa6;
    --sx-accent: #8B5CF6;
    --sx-accent2: #EC4899;
    --sx-green: #34d399;
    --sx-purple: #a78bfa;
    --sx-red: #f87171;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif !important;
}
#semex-overlay .overlay-full {
    background: linear-gradient(160deg, #14141b, #0c0c11) !important;
    border: 1px solid var(--sx-line) !important;
    border-radius: 16px !important;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(124,92,255,.08) !important;
    backdrop-filter: blur(14px) !important;
    overflow: hidden !important;
    width: min(330px, calc(100vw - 32px)) !important;
}
#semex-overlay .full-header {
    background: rgba(124,92,255,.07) !important;
    border-bottom: 1px solid var(--sx-line) !important;
    padding: 12px 14px !important;
}
#semex-overlay .full-brand-logo,
#semex-overlay .pill-logo,
#semex-overlay .dock-logo {
    background: linear-gradient(135deg, var(--sx-accent), var(--sx-accent2)) !important;
    border-radius: 9px !important;
    box-shadow: 0 4px 14px rgba(124,92,255,.4) !important;
}
#semex-overlay .full-brand-name {
    font-weight: 800 !important; letter-spacing: .16em !important;
    background: linear-gradient(135deg, #fff, var(--sx-accent2)) !important;
    -webkit-background-clip: text !important; background-clip: text !important;
    -webkit-text-fill-color: transparent !important;
}
#semex-overlay .full-brand-tag { color: var(--sx-mut) !important; letter-spacing: .05em !important; }
#semex-overlay .header-btn {
    background: transparent !important; border: 1px solid var(--sx-line) !important;
    color: var(--sx-mut) !important; border-radius: 7px !important;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease !important;
}
#semex-overlay .header-btn:hover { color: #fff !important; background: rgba(255,255,255,.06) !important; border-color: var(--sx-accent) !important; }
#semex-overlay .full-body { padding: 12px 14px 14px !important; }
#semex-overlay .full-status {
    background: var(--sx-surface) !important; border: 1px solid var(--sx-line) !important;
    border-radius: 10px !important; padding: 8px 12px !important; color: var(--sx-txt) !important; font-weight: 600 !important;
}
#semex-overlay .full-stats {
    background: var(--sx-surface) !important; border: 1px solid var(--sx-line) !important;
    border-radius: 12px !important; padding: 10px 6px !important; margin: 10px 0 !important;
}
#semex-overlay .stat-label { color: var(--sx-mut) !important; font-size: 10px !important; text-transform: uppercase !important; letter-spacing: .06em !important; }
#semex-overlay .stat-value { font-family: ui-monospace, "SF Mono", Menlo, monospace !important; font-weight: 700 !important; font-size: 18px !important; color: #fff !important; }
#semex-overlay .stat-value.charged { color: var(--sx-green) !important; }
#semex-overlay .stat-value.live { color: var(--sx-purple) !important; }
#semex-overlay .stat-value.dead { color: var(--sx-red) !important; }
#semex-overlay .stat-div { background: var(--sx-line) !important; }
#semex-overlay .full-details { color: var(--sx-mut) !important; font-size: 12px !important; }
#semex-overlay .detail-val { color: var(--sx-txt) !important; font-family: ui-monospace, Menlo, monospace !important; }
#semex-overlay .full-controls { gap: 8px !important; margin-top: 10px !important; }
#semex-overlay .ctrl-btn {
    border-radius: 10px !important; font-weight: 700 !important; border: 1px solid var(--sx-line) !important;
    color: var(--sx-txt) !important; background: var(--sx-surface) !important;
    transition: transform .1s cubic-bezier(.4,0,.2,1), filter .15s ease, background-color .15s ease !important;
}
#semex-overlay .ctrl-btn:active { transform: scale(.96) !important; }
#semex-overlay .ctrl-btn.start {
    background: linear-gradient(135deg, var(--sx-green), #10b981) !important;
    color: #05130d !important; border: none !important; box-shadow: 0 6px 18px rgba(52,211,153,.35) !important;
}
#semex-overlay .ctrl-btn.start:hover { filter: brightness(1.08) !important; }
#semex-overlay .ctrl-btn.pause { background: rgba(251,191,36,.14) !important; color: #fbbf24 !important; border-color: rgba(251,191,36,.3) !important; }
#semex-overlay .ctrl-btn.stop { background: rgba(248,113,113,.14) !important; color: var(--sx-red) !important; border-color: rgba(248,113,113,.3) !important; }
#semex-overlay .ctrl-btn.blur { background: var(--sx-surface) !important; }
/* Pill (minimized) */
#semex-overlay .overlay-pill {
    background: linear-gradient(135deg, #16161c, #0c0c11) !important;
    border: 1px solid var(--sx-line) !important; border-radius: 999px !important;
    box-shadow: 0 12px 34px rgba(0,0,0,.55) !important;
}
#semex-overlay .pill-btn {
    border-radius: 999px !important; border: none !important;
    transition: transform .1s ease, filter .15s ease !important;
}
#semex-overlay .pill-btn:active { transform: scale(.92) !important; }
#semex-overlay .pill-btn.play { background: linear-gradient(135deg, var(--sx-green), #10b981) !important; color: #05130d !important; }
#semex-overlay .pill-btn.stop { background: rgba(248,113,113,.18) !important; color: var(--sx-red) !important; }
#semex-overlay .pill-text { color: var(--sx-txt) !important; font-weight: 600 !important; }
/* Status dots pulse */
#semex-overlay .pill-dot, #semex-overlay .dock-dot { box-shadow: 0 0 0 0 currentColor !important; }

/* Charged celebration confetti (matches dashboard black/purple/pink theme) */
#semex-confetti-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 2147483646; overflow: hidden;
}
.semex-confetti-piece {
    position: absolute; top: -14px; border-radius: 2px; opacity: 0;
    will-change: transform, opacity;
    animation: semex-confetti-fall cubic-bezier(.15,.5,.4,1) forwards;
}
@keyframes semex-confetti-fall {
    0% { opacity: 0; transform: translateY(-14px) rotate(0); }
    12% { opacity: 1; }
    100% { opacity: 0; transform: translateY(106vh) rotate(720deg); }
}

/* Drag support */
#semex-overlay.is-dragging { transition: none !important; user-select: none; }
#semex-overlay .full-header { cursor: move; user-select: none; }
#semex-overlay .full-header .header-btn { cursor: pointer; }

/* =========================================
   V3 REFINED LIQUID-GLASS THEME
   Matches the dashboard's --accent-purple / --accent-pink token system.
   All rules are !important because we're overriding the earlier V2 defaults.
   ========================================= */
#semex-overlay {
    --sx-glass:      rgba(20, 18, 32, 0.72);
    --sx-glass-hi:   rgba(30, 26, 46, 0.85);
    --sx-border:     rgba(200, 120, 255, 0.18);
    --sx-border-hi:  rgba(200, 120, 255, 0.42);
    --sx-purple:     #a855f7;
    --sx-pink:       #ec4899;
    --sx-glow-p:     0 0 24px rgba(168, 85, 247, 0.35);
    --sx-glow-pk:    0 0 24px rgba(236, 72, 153, 0.35);
    --sx-shadow:     0 20px 60px -20px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.02) inset;
}

/* --- FULL panel --- */
#semex-overlay .overlay-full {
    background: var(--sx-glass) !important;
    -webkit-backdrop-filter: blur(14px) saturate(140%) !important;
    backdrop-filter: blur(14px) saturate(140%) !important;
    border: 1px solid var(--sx-border) !important;
    border-radius: 18px !important;
    box-shadow: var(--sx-shadow) !important;
    overflow: hidden !important;
}
#semex-overlay .overlay-full::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(1200px 300px at -10% -10%, rgba(168,85,247,0.16), transparent 60%),
        radial-gradient(1200px 300px at 110% 110%, rgba(236,72,153,0.14), transparent 60%);
    z-index: 0;
}
#semex-overlay .overlay-full > * { position: relative; z-index: 1; }

/* --- Header (drag handle) --- */
#semex-overlay .full-header {
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0)) !important;
    border-bottom: 1px solid var(--sx-border) !important;
    padding: 12px 16px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: 12px !important;
}
#semex-overlay .full-header::before {
    content: "";
    display: inline-block;
    width: 32px;
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--sx-purple), var(--sx-pink));
    margin-right: 10px;
    opacity: 0.7;
    box-shadow: var(--sx-glow-p);
}
#semex-overlay .header-title,
#semex-overlay .full-header .title {
    font-family: -apple-system, "Inter", "Segoe UI", sans-serif !important;
    font-weight: 700 !important;
    letter-spacing: 0.6px !important;
    color: #fff !important;
    text-transform: uppercase !important;
    font-size: 12px !important;
    background: linear-gradient(90deg, #fff, #e9d5ff 60%, #fbcfe8) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    -webkit-text-fill-color: transparent !important;
}
#semex-overlay .header-btn {
    width: 28px !important; height: 28px !important;
    border-radius: 8px !important;
    background: rgba(255,255,255,0.06) !important;

<script>
(function() {
    const p = new URLSearchParams(location.search);
    const state = p.get('state') || 'full';
    const shortWin = p.get('shortwin') === '1';
    const menuOpen = p.get('binmenu') === '1';
    const idle = p.get('idle') === '1';
    const stripeHost = p.get('stripe-host') === '1';

    // ── Stripe / merchant host-page style simulation ──────────────────────
    // Inject a <style> element BEFORE the overlay <style> block so the
    // extension CSS loads later and should override via specificity + order.
    // This is the correct direction: host CSS first, extension CSS second.
    if (stripeHost) {
        const hostStyle = document.createElement('style');
        hostStyle.id = 'stripe-host-sim';
        hostStyle.textContent = `
/* ═══ SIMULATED STRIPE / MERCHANT HOST-PAGE CSS ═══
   Represents the most hostile patterns seen on
   checkout.stripe.com and buy.stripe.com.
   ═══════════════════════════════════════════════ */

/* 1. Box-model reset (common in Tailwind/Normalize setups) */
*, *::before, *::after { box-sizing: content-box; }

/* 2. Stripe's layout root: overflow hidden on html + body */
html, body { overflow: hidden; height: 100%; }

/* 3. Merchant theme: button all:unset (breaks unstyled buttons) */
button { all: unset; cursor: pointer; display: inline-flex;
         align-items: center; justify-content: center; }

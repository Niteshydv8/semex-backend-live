<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMEX Toaster — B FINAL (animated)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #07090c; overflow: hidden;
    background-image: radial-gradient(circle at 20% 10%, #0d1420 0%, transparent 60%); }

  .stack { position: fixed; top: 14px; right: 14px; display: flex; flex-direction: column;
    gap: 8px; width: min(320px, calc(100vw - 28px)); font-family: 'JetBrains Mono', monospace; }

  /* toast base */
  .t { position: relative; background: rgba(10, 14, 12, 0.92); border: 1px solid #1c2420;
    border-left: 3px solid var(--ac); padding: 9px 12px 9px 14px;
    box-shadow: 0 0 26px var(--glow), 0 8px 24px rgba(0,0,0,.55);
    transform-origin: right center; }

  /* ENTRANCE: motion-blur slide right→left + aura pulse on land */
  .t.in { animation: slideIn .42s cubic-bezier(.2,.9,.3,1.05) both, aura .9s ease-out .30s; }
  @keyframes slideIn {
    0%   { transform: translateX(70px) skewX(-6deg); opacity: 0; filter: blur(11px); }
    55%  { opacity: 1; filter: blur(3px); }
    100% { transform: none; opacity: 1; filter: blur(0); } }
  @keyframes aura {
    0%   { box-shadow: 0 0 0 var(--glow), 0 8px 24px rgba(0,0,0,.55); }
    40%  { box-shadow: 0 0 40px var(--glow2), 0 8px 24px rgba(0,0,0,.55); }
    100% { box-shadow: 0 0 26px var(--glow), 0 8px 24px rgba(0,0,0,.55); } }

  /* EXIT: blur back out to the right */
  .t.out { animation: slideOut .34s cubic-bezier(.5,0,.75,0) both; }
  @keyframes slideOut {
    0%   { transform: none; opacity: 1; filter: blur(0); }
    100% { transform: translateX(70px); opacity: 0; filter: blur(9px); } }

  .t .head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
    letter-spacing: .04em; color: var(--ac); }
  .t .glyph { font-size: 13px; }
  .t .sub { margin-top: 3px; font-size: 10.5px; color: #88908a; }
  .t .rows { margin-top: 7px; border-top: 1px dashed #1e2a24; padding-top: 6px; }
  .t .row { display: flex; justify-content: space-between; gap: 10px; font-size: 10.5px;
    line-height: 1.7; color: #9fb3a6; }
  .t .row .k { color: #5c6b62; }
  .t .row .v { color: #d3e3d8; text-align: right; word-break: break-all; }
  .t .row .v.good { color: #34d399; }

  /* palette: bypass=BLUE · live=GOLD · charged=GREEN · dead=red */
  .t.hitting { --ac:#60a5fa; --glow:rgba(96,165,250,.16); --glow2:rgba(96,165,250,.5); border-left-color:#60a5fa; }
  .t.hitting .glyph { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .t.live    { --ac:#fbbf24; --glow:rgba(251,191,36,.16); --glow2:rgba(251,191,36,.5); border-left-color:#fbbf24; }
  .t.charged { --ac:#34d399; --glow:rgba(52,211,153,.18); --glow2:rgba(52,211,153,.55); border-left-color:#34d399; }
  .t.dead    { --ac:#f87171; --glow:rgba(248,113,113,.14); --glow2:rgba(248,113,113,.45); border-left-color:#f87171; }

  .t .trace { margin-top: 7px; height: 3px; background: #10161c; overflow: hidden; }
  .t .trace i { display: block; height: 100%; width: 40%; background: #60a5fa;
    box-shadow: 0 0 8px rgba(96,165,250,.6); animation: trace 1.1s linear infinite; }
  @keyframes trace { from { transform: translateX(-100%);} to { transform: translateX(260%);} }

  .brand { position: absolute; top: 8px; right: 10px; font-size: 8px; letter-spacing: .18em; color: #3a443c; }

  @media (prefers-reduced-motion: reduce) {
    .t.in, .t.out { animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="stack" id="stack"></div>
<script>
  var SEQ = [
    { cls: "hitting", glyph: "▸", title: "STRIPE BYPASS", sub: "automated process initiated…", trace: true },
    { cls: "live",    glyph: "●", title: "LIVE — STRIPE",  sub: "card live · CVV matched" },
    { cls: "charged", glyph: "▲", title: "CHARGED — STRIPE", rows: [
        ["GATEWAY", "STRIPE", ""], ["RESPONSE", "Payment successful", "good"], ["ID", "pi_3SJm9vLkdJvNnInc2Jexample", ""] ] },
    { cls: "dead",    glyph: "×", title: "DEAD — STRIPE",   sub: "card declined · insufficient funds" }
  ];
  var stack = document.getElementById("stack");

  function build(d) {
    var t = document.createElement("div");
    t.className = "t " + d.cls + " in";
    var rows = d.rows ? '<div class="rows">' + d.rows.map(function (r) {
      return '<div class="row"><span class="k">' + r[0] + '</span><span class="v ' + r[2] + '">' + r[1] + '</span></div>';
    }).join("") + '</div>' : "";
    var sub = d.sub ? '<div class="sub">' + d.sub + '</div>' : "";
    var tr = d.trace ? '<div class="trace"><i></i></div>' : "";
    t.innerHTML = '<div class="head"><span class="glyph">' + d.glyph + '</span> ' + d.title +
      ' <span class="brand">SEMEX</span></div>' + sub + rows + tr;
    return t;
  }

  var i = 0;
  function tick() {
    var t = build(SEQ[i % SEQ.length]);
    stack.appendChild(t);
    // auto-dismiss each toast after a few seconds with exit animation
    setTimeout(function () {
      t.classList.remove("in"); t.classList.add("out");
      setTimeout(function () { if (t.parentNode) t.remove(); }, 360);
    }, 4200);
    i++;
    // clear + restart the cycle after the full set so the loop is watchable
    if (i % SEQ.length === 0) {
      setTimeout(tick, 2200);
    } else {
      setTimeout(tick, 850);
    }
  }
  tick();
</script>
</body>
</html>

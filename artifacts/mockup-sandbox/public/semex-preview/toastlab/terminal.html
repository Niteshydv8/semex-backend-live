<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SEMEX Toaster — B · Terminal Trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #07090c; overflow: hidden;
    background-image: radial-gradient(circle at 20% 10%, #0d1420 0%, transparent 60%); }

  /* ── stack ── */
  .stack { position: fixed; top: 14px; right: 14px; display: flex; flex-direction: column;
    gap: 8px; width: 320px; font-family: 'JetBrains Mono', monospace; }

  /* ── one toast = one terminal line-block ── */
  .t { position: relative; background: rgba(10, 14, 10, 0.92); border: 1px solid #1c2b1c;
    border-left: 3px solid var(--ac, #4ade80); padding: 9px 12px 9px 14px;
    box-shadow: 0 0 24px rgba(74, 222, 128, 0.07), 0 8px 24px rgba(0,0,0,.5);
    animation: slideIn .28s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

  .t .head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
    letter-spacing: .04em; color: var(--ac, #4ade80); }
  .t .glyph { font-size: 13px; }
  .t .sub { margin-top: 3px; font-size: 10.5px; color: #7d8a7d; }
  .t .rows { margin-top: 7px; border-top: 1px dashed #1c2b1c; padding-top: 6px; }
  .t .row { display: flex; justify-content: space-between; gap: 10px; font-size: 10.5px;
    line-height: 1.7; color: #9fb39f; }
  .t .row .k { color: #5c6b5c; }
  .t .row .v { color: #cfe3cf; text-align: right; word-break: break-all; }
  .t .row .v.good { color: #4ade80; }

  /* states */
  .t.live    { --ac: #4ade80; }
  .t.charged { --ac: #34d399; border-left-color: #34d399; }
  .t.hitting { --ac: #facc15; border-left-color: #facc15; }
  .t.hitting .glyph { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .t.dead    { --ac: #f87171; border-left-color: #f87171; }

  /* hitting progress trace */
  .t .trace { margin-top: 7px; height: 3px; background: #131a13; overflow: hidden; }
  .t .trace i { display: block; height: 100%; width: 40%; background: #facc15;
    animation: trace 1.1s linear infinite; }
  @keyframes trace { from { transform: translateX(-100%);} to { transform: translateX(260%);} }

  .brand { position: absolute; top: 8px; right: 10px; font-size: 8px; letter-spacing: .18em;
    color: #3a4a3a; }
</style>
</head>
<body>
<div class="stack">
  <div class="t hitting">
    <div class="head"><span class="glyph">▸</span> STRIPE BYPASS <span class="brand">SEMEX</span></div>
    <div class="sub">automated process initiated…</div>
    <div class="trace"><i></i></div>
  </div>
  <div class="t live">
    <div class="head"><span class="glyph">●</span> LIVE — STRIPE <span class="brand">SEMEX</span></div>
    <div class="sub">card live · CVV matched</div>
  </div>
  <div class="t charged">
    <div class="head"><span class="glyph">▲</span> CHARGED — STRIPE <span class="brand">SEMEX</span></div>
    <div class="rows">
      <div class="row"><span class="k">GATEWAY</span><span class="v">STRIPE</span></div>
      <div class="row"><span class="k">RESPONSE</span><span class="v good">Payment successful</span></div>
      <div class="row"><span class="k">ID</span><span class="v">pi_3SJm9vLkdJvNnInc2Jexample</span></div>
    </div>
  </div>
  <div class="t dead">
    <div class="head"><span class="glyph">×</span> DEAD — STRIPE <span class="brand">SEMEX</span></div>
    <div class="sub">card declined · insufficient funds</div>
  </div>
</div>
</body>
</html>

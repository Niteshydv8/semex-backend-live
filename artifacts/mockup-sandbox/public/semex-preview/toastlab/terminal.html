<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMEX Toaster — B · Terminal Trace v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #07090c; overflow: hidden;
    background-image: radial-gradient(circle at 20% 10%, #0d1420 0%, transparent 60%); }

  /* ── stack: top-right, responsive on phone + PC ── */
  .stack { position: fixed; top: 14px; right: 14px; display: flex; flex-direction: column;
    gap: 8px; width: min(320px, calc(100vw - 28px)); font-family: 'JetBrains Mono', monospace; }

  /* ── one toast = one terminal line-block ── */
  .t { position: relative; background: rgba(10, 14, 12, 0.92); border: 1px solid #1c2420;
    border-left: 3px solid var(--ac); padding: 9px 12px 9px 14px;
    box-shadow: 0 0 26px var(--glow), 0 8px 24px rgba(0,0,0,.55);
    animation: slideIn .38s cubic-bezier(.2,.9,.3,1.05); }
  /* motion-blur entrance: right → left, blur dissolves as it lands */
  @keyframes slideIn {
    0%   { transform: translateX(64px); opacity: 0; filter: blur(10px); }
    55%  { opacity: 1; filter: blur(3px); }
    100% { transform: none; opacity: 1; filter: blur(0); } }

  .t .head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
    letter-spacing: .04em; color: var(--ac); }
  .t .glyph { font-size: 13px; }
  .t .sub { margin-top: 3px; font-size: 10.5px; color: #88908a; }
  .t .rows { margin-top: 7px; border-top: 1px dashed #1e2a24; padding-top: 6px; }
  .t .row { display: flex; justify-content: space-between; gap: 10px; font-size: 10.5px;
    line-height: 1.7; color: #9fb3a6; }
  .t .row .k { color: #5c6b62; }
  .t .row .v { color: #d3e3d8; text-align: right; word-break: break-all; }
  .t .row .v.good { color: #34d399; }

  /* ── states: user-approved palette ──
     bypass = BLUE · live = GOLD/YELLOW · charged = GREEN · dead = red */
  .t.hitting { --ac: #60a5fa; --glow: rgba(96, 165, 250, .16); border-left-color: #60a5fa; }
  .t.hitting .glyph { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .t.live    { --ac: #fbbf24; --glow: rgba(251, 191, 36, .16); border-left-color: #fbbf24; }
  .t.charged { --ac: #34d399; --glow: rgba(52, 211, 153, .18); border-left-color: #34d399; }
  .t.dead    { --ac: #f87171; --glow: rgba(248, 113, 113, .14); border-left-color: #f87171; }

  /* hitting progress trace — blue to match */
  .t .trace { margin-top: 7px; height: 3px; background: #10161c; overflow: hidden; }
  .t .trace i { display: block; height: 100%; width: 40%; background: #60a5fa;
    box-shadow: 0 0 8px rgba(96,165,250,.6); animation: trace 1.1s linear infinite; }
  @keyframes trace { from { transform: translateX(-100%);} to { transform: translateX(260%);} }

  .brand { position: absolute; top: 8px; right: 10px; font-size: 8px; letter-spacing: .18em;
    color: #3a443c; }
</style>
</head>
<body>
<div class="stack">
  <div class="t hitting">
    <div class="head"><span class="glyph">▸</span> STRIPE BYPASS <span class="brand">SEMEX</span></div>
    <div class="sub">automated process initiated…</div>
    <div class="trace"><i></i></div>
  </div>
  <div class="t live">
    <div class="head"><span class="glyph">●</span> LIVE — STRIPE <span class="brand">SEMEX</span></div>
    <div class="sub">card live · CVV matched</div>
  </div>
  <div class="t charged">
    <div class="head"><span class="glyph">▲</span> CHARGED — STRIPE <span class="brand">SEMEX</span></div>
    <div class="rows">
      <div class="row"><span class="k">GATEWAY</span><span class="v">STRIPE</span></div>
      <div class="row"><span class="k">RESPONSE</span><span class="v good">Payment successful</span></div>
      <div class="row"><span class="k">ID</span><span class="v">pi_3SJm9vLkdJvNnInc2Jexample</span></div>
    </div>
  </div>
  <div class="t dead">
    <div class="head"><span class="glyph">×</span> DEAD — STRIPE <span class="brand">SEMEX</span></div>
    <div class="sub">card declined · insufficient funds</div>
  </div>
</div>
</body>
</html>

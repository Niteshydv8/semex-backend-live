<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SEMEX Dashboard Preview</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<script>
// Static preview harness: loads dashboard.html markup, activates the tab from
// location.hash, hides login overlays, and injects mock data so every panel
// renders populated. NOT part of the extension — dev preview only.
(async function () {
  const res = await fetch("dashboard.html");
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  document.body.innerHTML = "";
  // Copy body content (app container + overlays)
  Array.from(doc.body.children).forEach(el => document.body.appendChild(el));

  // Force-hide overlays that JS would normally control
  ["auth-modal", "maintenance-overlay"].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.classList.remove("active"); el.style.display = "none"; }
  });

  // Activate tab from hash
  const tabName = (location.hash || "#bypass").slice(1);
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  const panel = document.getElementById(tabName + "-tab");
  if (panel) panel.classList.add("active");
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === tabName);
  });
  // Preview as owner: reveal the hidden admin nav + danger zone
  if (tabName === "admin") {
    const nav = document.getElementById("nav-admin");
    if (nav) nav.classList.remove("hidden");
    const dz = document.getElementById("admin-danger-zone");
    if (dz) dz.classList.remove("hidden");
  }

  // ---- Mock data ----
  // Stats row
  const vals = document.querySelectorAll(".stat-val");
  const stats = ["47", "12", "5", "30"];
  vals.forEach((v, i) => { if (stats[i] !== undefined) v.textContent = stats[i]; });
  const wins = document.getElementById("session-wins-count");
  if (wins) wins.textContent = "12";

  // History rows
  const hist = document.querySelector(".history-list");
  if (hist) {
    hist.innerHTML = "";
    const rows = [
      { badge: "charged", cls: "hit-badge-charged", pan: "4242 42•• •••• 4242", brand: "VISA · Stripe", time: "2m ago", site: "https://checkout.example-store.com", amount: "$49.99" },
      { badge: "live", cls: "hit-badge-live", pan: "5555 55•• •••• 4444", brand: "MASTERCARD · Braintree", time: "18m ago", site: "https://pay.demo-shop.io", amount: "$12.00" },
      { badge: "dead", cls: "hit-badge-dead", pan: "4000 00•• •••• 0002", brand: "VISA · Stripe", time: "1h ago", site: "https://billing.sample.net", amount: "—" },
    ];
    rows.forEach((r, i) => {
      const div = document.createElement("div");
      div.className = "hit-row";
      div.innerHTML =
        '<div class="hit-row-top">' +
          '<span class="hit-badge ' + r.cls + '">' + r.badge + '</span>' +
          '<span class="hit-pan">' + r.pan + '</span>' +
          '<span class="hit-brand">' + r.brand + '</span>' +
          '<span class="hit-time">' + r.time + '</span>' +
        '</div>' +
        (i === 0 ?
        '<div class="hit-row-body">' +
          '<div class="hit-details-grid">' +
            '<div><div class="result-label">Site</div><div class="hit-val">' + r.site + '</div></div>' +
            '<div><div class="result-label">Amount</div><div class="hit-val hit-amount">' + r.amount + '</div></div>' +
            '<div><div class="result-label">Gateway</div><div class="hit-val">stripe_checkout</div></div>' +
            '<div><div class="result-label">Response</div><div class="hit-response">succeeded — payment_intent confirmed</div></div>' +
          '</div>' +
        '</div>' : '');
      hist.appendChild(div);
    });
  }

  // BINs rows
  const bins = document.querySelector(".saved-bins-list");
  if (bins) {
    bins.innerHTML = "";
    [
      { name: "US Visa Platinum", code: "424242", meta: "VISA · Chase · United States", badge: "cloud" },
      { name: "UK Master Debit", code: "555555", meta: "MASTERCARD · Barclays · United Kingdom", badge: "local" },
      { name: "DE Amex", code: "378282", meta: "AMEX · Deutsche Bank · Germany", badge: "cloud" },
    ].forEach(b => {
      const div = document.createElement("div");
      div.className = "saved-bin-row";
      div.innerHTML =
        '<div class="saved-bin-info">' +
          '<span class="saved-bin-name">' + b.name + '</span>' +
          '<span class="saved-bin-code">' + b.code + '</span>' +
          '<span class="saved-bin-meta">' + b.meta + '</span>' +
        '</div>' +
        '<span class="saved-bin-badge">' + b.badge + '</span>' +
        '<div class="saved-bin-actions">' +
          '<button class="saved-bin-btn">Use</button>' +
          '<button class="saved-bin-btn">Delete</button>' +
        '</div>';
      bins.appendChild(div);
    });
  }

  // Admin tab mocks
  const statsGrid = document.getElementById("admin-stats-grid");
  if (statsGrid) {
    statsGrid.innerHTML = "";
    [["Total Users", "128"], ["Active Plans", "64"], ["Charged Hits", "412"], ["Live Hits", "96"], ["Dead Hits", "890"], ["Redeem Codes", "35"]].forEach(([l, v]) => {
      const d = document.createElement("div");
      d.className = "admin-stat-card";
      d.innerHTML = '<div class="admin-stat-label">' + l + '</div><div class="admin-stat-value">' + v + '</div>';
      statsGrid.appendChild(d);
    });
  }
  const roleBadge = document.getElementById("admin-role-badge");
  if (roleBadge) roleBadge.textContent = "Role: owner";
  const usersList = document.getElementById("admin-users-list");
  if (usersList) {
    usersList.innerHTML = "";
    [["N", "nitesh", "owner · lifetime"], ["R", "rajesh_k", "paid · 24d left"], ["A", "arjun99", "free · expired"]].forEach(([i, n, tag]) => {
      const d = document.createElement("div");
      d.className = "admin-user-row";
      d.innerHTML =
        '<div class="admin-user-avatar">' + i + '</div>' +
        '<div class="admin-user-info"><div class="admin-user-meta">' +
          '<span class="admin-user-name">' + n + '</span>' +
          '<span class="admin-user-tag">' + tag + '</span>' +
        '</div></div>' +
        '<div class="admin-user-actions">' +
          '<button class="admin-btn">+30d</button>' +
          '<button class="admin-btn">Ban</button>' +
        '</div>';
      usersList.appendChild(d);
    });
  }
  const codesList = document.getElementById("codes-list");
  if (codesList) {
    codesList.innerHTML = "";
    ["SEMEX-8K2M-4QPT · 30d · unused", "SEMEX-X9AA-11BB · lifetime · used by rajesh_k"].forEach(c => {
      const d = document.createElement("div");
      d.className = "code-row";
      d.innerHTML = "<span>" + c + "</span><button class=\"saved-bin-btn\">Copy</button>";
      codesList.appendChild(d);
    });
  }
  const allHits = document.getElementById("all-hits-list");
  if (allHits) {
    allHits.innerHTML = "";
    [["rajesh_k", "4242 42•• •••• 4242", "$49.99", "2m ago"], ["nitesh", "5555 55•• •••• 4444", "$120.00", "26m ago"]].forEach(([u, p, a, t]) => {
      const d = document.createElement("div");
      d.className = "tx-card";
      d.innerHTML =
        '<div class="tx-header"><div class="tx-header-l">' +
          '<span class="hit-badge hit-badge-charged">charged</span>' +
          '<span class="tx-pan">' + p + '</span>' +
          '<span class="hit-user-chip">' + u + '</span>' +
        '</div><div class="tx-header-r">' +
          '<span class="tx-amount">' + a + '</span>' +
          '<span class="tx-time">' + t + '</span>' +
        '</div></div>';
      allHits.appendChild(d);
    });
  }
  const releasesList = document.getElementById("releases-list");
  if (releasesList) {
    releasesList.innerHTML = "";
    ["v2.9.12 · latest · 2.1 MB", "v2.9.11 · 2.0 MB"].forEach(r => {
      const d = document.createElement("div");
      d.className = "code-row";
      d.innerHTML = "<span>" + r + "</span>";
      releasesList.appendChild(d);
    });
  }

  // Proxy connected state + saved list
  const proxyIp = document.querySelector(".proxy-ip");
  if (proxyIp) proxyIp.textContent = "192.168.100.25:8080";
  const proxyLatency = document.querySelector(".proxy-latency");
  if (proxyLatency) proxyLatency.textContent = "84ms";
  const proxyCountry = document.querySelector(".proxy-country");
  if (proxyCountry) proxyCountry.textContent = "Germany";
  const proxyList = document.querySelector(".proxy-results");
  if (proxyList) {
    proxyList.innerHTML = "";
    ["45.155.20.11:8080 · DE · 84ms", "103.75.190.42:1080 · NL · 122ms", "198.50.210.9:3128 · US · 203ms"].forEach(p => {
      const div = document.createElement("div");
      div.className = "proxy-row";
      div.innerHTML = '<span class="sys-dot status-connected"></span><span class="proxy-ip" style="font-size:.74rem">' + p + '</span>';
      proxyList.appendChild(div);
    });
  }
})();
</script>
</body>
</html>

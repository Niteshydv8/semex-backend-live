<!DOCTYPE html>
<!--
  Fixture: Stripe hosted-fields (Elements) frame HTML snapshot
  Source:  js.stripe.com/v3/elements-inner-*.html  (classic hosted-fields variant, Field-* IDs)
  Purpose: Minimal structural snapshot containing ONLY the element IDs that
           getSelectors() targets.  Attributes beyond `id` are intentionally
           omitted so that element.matches(selectorList) can pass ONLY via an
           ID-based selector token — never via a fallback name/autocomplete/class.
           This makes the Part F tests actually catch stale selector IDs.

  Captured: 2026-08-19 (hosted-fields / Elements variant).
-->

<head><meta charset="utf-8"><title>Stripe Hosted Fields (Elements)</title></head>

  <!-- CVC / CVV -->

  <!-- Cardholder name -->

  <!-- Address line 2 -->

  <!-- Postal code -->

  <!-- Country -->

  <!-- City -->

  <!-- Phone -->

</html>
